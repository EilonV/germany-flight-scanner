name: Flight scan

on:
  schedule:
    # 05:00 and 17:00 UTC = 08:00 and 20:00 Israel time, twice a day.
    # Each run commits results, which also keeps GitHub from auto-disabling
    # this workflow after 60 days of repo inactivity.
    - cron: "0 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICE_THRESHOLD_NIS: ${{ vars.PRICE_THRESHOLD_NIS || '800' }}
          ALERT_ON_NEW_LOW: ${{ vars.ALERT_ON_NEW_LOW || 'true' }}
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name  "flight-scanner"
          git config user.email "actions@github.com"
          git add index.html data/state.json
          git diff --staged --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
